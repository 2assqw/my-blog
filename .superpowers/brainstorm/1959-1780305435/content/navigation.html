<h2>用户如何翻页？</h2>
<p class="subtitle">可选择多个交互方式组合</p>

<div class="options" data-multiselect>
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>点击页面左右边缘</h3>
      <p>点左侧向左翻，点右侧向右翻。最直观，桌面和移动端通用。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>底部箭头按钮</h3>
      <p>页面底部固定 ← 上一页 下一页 → 按钮。最明确，不会误触。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>触摸滑动</h3>
      <p>手指左滑翻下一页，右滑回上一页。移动端原生体验，桌面端用鼠标拖拽。</p>
    </div>
  </div>
  <div class="option" data-choice="d" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>键盘方向键</h3>
      <p>按 → 翻下一页，← 回上一页。桌面端阅读效率最高。</p>
    </div>
  </div>
</div>
