<h2>分页策略</h2>
<p class="subtitle">内容如何在各页之间分配</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>段落感知分页（推荐）</h3>
      <p>尽量在段落边界断开，避免同一段落跨页。标题和其后的第一段会尽量放在同一页。每页在 800-1200 字之间浮动。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>严格字数切割</h3>
      <p>精确到 1000 字切断，不管位置。代码块、段落、甚至词语都可能被截断。更整齐但阅读体验差。</p>
    </div>
  </div>
</div>
